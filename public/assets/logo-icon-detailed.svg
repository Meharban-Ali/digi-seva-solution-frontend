<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Shield Multi-Stop Gradient -->
    <linearGradient id="shieldBgGradDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Shield Rim Metallic Gold Highlight -->
    <linearGradient id="rimGradDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.95" />
    </linearGradient>

    <!-- Warm Gold Accent Gradient -->
    <linearGradient id="goldGradDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Lighter Blue Foreground Monogram Gradient -->
    <linearGradient id="blueFgGradDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Darker Navy Monogram Background Layer Gradient -->
    <linearGradient id="navyBgGradDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="badgeShadowDet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Classic Crest/Shield Outer Silhouette -->
  <path d="M256 26 C360 26 438 65 438 180 C438 315 352 420 256 478 C160 420 74 315 74 180 C74 65 152 26 256 26 Z" fill="url(#shieldBgGradDet)" filter="url(#badgeShadowDet)" />

  <!-- Shield Outer Rim Accent -->
  <path d="M256 40 C348 40 420 76 420 178 C420 300 342 398 256 452 C170 398 92 300 92 178 C92 76 164 40 256 40 Z" fill="none" stroke="url(#rimGradDet)" stroke-width="7" stroke-linecap="round" />

  <!-- Inset Dark Contrast Shield Bed -->
  <path d="M256 56 C334 56 398 90 398 176 C398 286 328 376 256 426 C184 376 114 286 114 176 C114 90 178 56 256 56 Z" fill="#0F172A" fill-opacity="0.55" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="2" />

  <!-- DYNAMIC GOLD SWOOSH (Flowing Behind Monogram) -->
  <path d="M106 312 C 185 390 330 370 425 240 C 355 315 215 332 106 312 Z" fill="url(#goldGradDet)" />

  <!-- TECH / CIRCUIT BOARD NODES (Integrated into Gold Swoosh) -->
  <path d="M370 265 L395 242 M385 285 L415 270 M360 305 L390 310" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <circle cx="395" cy="242" r="4.5" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />
  <circle cx="415" cy="270" r="4.5" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />
  <circle cx="390" cy="310" r="4" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />

  <!-- STYLIZED INTERLOCKING "DS" MONOGRAM -->
  <!-- Layer 1: Dark Navy Background Layer (Creates Depth/3D Shadow) -->
  <g transform="translate(6, 6)">
    <!-- 'D' Background -->
    <path d="M168 142 H255 C310 142 348 178 348 238 C348 298 310 334 255 334 H168 V142 Z M208 178 V298 H250 C284 298 306 276 306 238 C306 200 284 178 250 178 H208 Z" fill="url(#navyBgGradDet)" opacity="0.85" />
    <!-- 'S' Background -->
    <path d="M336 172 C324 154 300 142 270 142 C228 142 200 166 200 198 C200 248 300 236 300 278 C300 296 282 308 256 308 C226 308 200 290 188 268 L152 288 C172 324 210 346 256 346 C308 346 342 318 342 276 C342 222 242 236 242 196 C242 182 256 174 272 174 C292 174 310 184 320 200 L336 172 Z" fill="url(#navyBgGradDet)" opacity="0.85" />
  </g>

  <!-- Layer 2: Lighter Blue Foreground Layer (Primary Monogram) -->
  <g>
    <!-- 'D' Foreground -->
    <path d="M168 142 H255 C310 142 348 178 348 238 C348 298 310 334 255 334 H168 V142 Z M208 178 V298 H250 C284 298 306 276 306 238 C306 200 284 178 250 178 H208 Z" fill="url(#blueFgGradDet)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- 'S' Interlocking Ribbon Foreground -->
    <path d="M336 172 C324 154 300 142 270 142 C228 142 200 166 200 198 C200 248 300 236 300 278 C300 296 282 308 256 308 C226 308 200 290 188 268 L152 288 C172 324 210 346 256 346 C308 346 342 318 342 276 C342 222 242 236 242 196 C242 182 256 174 272 174 C292 174 310 184 320 200 L336 172 Z" fill="url(#goldGradDet)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- CROWNING 4-POINT STAR ACCENT AT TOP -->
  <path d="M256 55 L264 74 L283 82 L264 90 L256 109 L248 90 L229 82 L248 74 Z" fill="url(#goldGradDet)" />
  <circle cx="256" cy="82" r="3" fill="#FFFFFF" />
</svg>